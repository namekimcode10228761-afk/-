
name: Build RAMForsaken ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Prepare disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache || true
          df -h /

      - name: Build RAMForsaken operating system
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ramforsaken

          cat > ramforsaken/build.sh <<'BUILD_SCRIPT'
          #!/bin/bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          mkdir -p work
          cd work

          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas 'main contrib non-free-firmware' \
            --debian-installer false \
            --bootappend-live 'boot=live components toram username=player locales=ko_KR.UTF-8 keyboard-layouts=us'

          mkdir -p config/package-lists
          mkdir -p config/includes.chroot/etc/lightdm/lightdm.conf.d
          mkdir -p config/includes.chroot/etc/skel/.config/openbox
          mkdir -p config/includes.chroot/usr/local/bin
          mkdir -p config/hooks/live

          cat > config/package-lists/ramforsaken.list.chroot <<'PKGS'
          linux-image-amd64
          live-boot
          live-config
          systemd-sysv
          xserver-xorg
          xserver-xorg-video-amdgpu
          xserver-xorg-input-libinput
          lightdm
          openbox
          network-manager
          flatpak
          dbus-x11
          ca-certificates
          mesa-vulkan-drivers
          libgl1-mesa-dri
          firmware-amd-graphics
          firmware-linux-free
          fcitx5
          fcitx5-hangul
          fonts-noto-cjk
          locales
          sudo
          pciutils
          PKGS

          cat > config/includes.chroot/etc/lightdm/lightdm.conf.d/50-ramforsaken.conf <<'LIGHTDM'
          [Seat:*]
          autologin-user=player
          autologin-user-timeout=0
          user-session=openbox
          LIGHTDM

          cat > config/includes.chroot/etc/skel/.config/openbox/autostart <<'AUTOSTART'
          #!/bin/sh
          export GTK_IM_MODULE=fcitx
          export QT_IM_MODULE=fcitx
          export XMODIFIERS=@im=fcitx

          fcitx5 -d >/tmp/fcitx5.log 2>&1 &
          (sleep 5; /usr/local/bin/ramforsaken-sober) >/tmp/sober.log 2>&1 &
          AUTOSTART

          cat > config/includes.chroot/etc/skel/.config/openbox/menu.xml <<'MENU'
          <?xml version="1.0" encoding="utf-8"?>
          <openbox_menu xmlns="http://openbox.org/3.4/menu">
            <menu id="root-menu" label="RAMForsaken">
              <item label="Sober">
                <action name="Execute">
                  <command>/usr/local/bin/ramforsaken-sober</command>
                </action>
              </item>
              <item label="Power off">
                <action name="Execute">
                  <command>systemctl poweroff</command>
                </action>
              </item>
            </menu>
          </openbox_menu>
          MENU

          cat > config/includes.chroot/usr/local/bin/ramforsaken-sober <<'SOBER'
          #!/bin/sh
          exec /usr/bin/flatpak run --system org.vinegarhq.Sober
          SOBER

          cat > config/hooks/live/0100-setup.hook.chroot <<'SETUP'
          #!/bin/sh
          set -eu
          sed -i 's/^# *ko_KR.UTF-8 UTF-8/ko_KR.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen ko_KR.UTF-8
          update-locale LANG=ko_KR.UTF-8

          cat > /etc/environment <<'ENV'
          LANG=ko_KR.UTF-8
          GTK_IM_MODULE=fcitx
          QT_IM_MODULE=fcitx
          XMODIFIERS=@im=fcitx
          ENV
          SETUP

          cat > config/hooks/live/0200-sober.hook.chroot <<'INSTALL_SOBER'
          #!/bin/sh
          set -eu
          flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          dbus-run-session -- flatpak install --system --noninteractive --assumeyes flathub org.vinegarhq.Sober
          flatpak info --system org.vinegarhq.Sober
          INSTALL_SOBER

          chmod +x config/hooks/live/*.hook.chroot
          chmod +x config/includes.chroot/usr/local/bin/ramforsaken-sober
          chmod +x config/includes.chroot/etc/skel/.config/openbox/autostart

          lb build 2>&1 | tee /work/ramforsaken/build.log

          iso=$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"

          cp "$iso" /work/ramforsaken/RAMForsaken.iso
          sha256sum /work/ramforsaken/RAMForsaken.iso > /work/ramforsaken/SHA256SUMS.txt
          BUILD_SCRIPT

          chmod +x ramforsaken/build.sh

          sudo docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build \
                debootstrap \
                squashfs-tools \
                xorriso \
                ca-certificates \
                curl \
                gnupg \
                grub-pc-bin \
                grub-efi-amd64-bin \
                isolinux \
                syslinux-common
              ./ramforsaken/build.sh
            '

          test -s ramforsaken/RAMForsaken.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: RAMForsaken-ISO
          path: |
            ramforsaken/RAMForsaken.iso
            ramforsaken/SHA256SUMS.txt
          if-no-files-found: error
